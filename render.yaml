services:
  - type: web
    name: jagadamba-plastics-public-web-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_CONVEX_URL
        sync: false
      - key: VITE_SITE_URL
        value: https://jagadamba-plastics-public-web-demo.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
